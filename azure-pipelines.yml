# Playmix MVC - Build (Maven) + Deploy no Azure Web App
# Repositório: ProfAntonioFigueiredo/playmix-mvc
# Equivalente ao workflow do GitHub Actions, agora em Azure Pipelines

trigger:
- main

variables:
  # Nome da Service Connection criada em Project Settings > Service connections
  azureServiceConnection: 'svc-azure-playmix'
  # Nome do App Service no portal
  webAppName: 'playmix-mvc-pf1776'
  # Runtime do App Service (Linux). Para Windows, ver comentário no stage Deploy
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build com Maven'
  jobs:
  - job: MavenBuild
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Maven@3
      displayName: 'mvn package'
      inputs:
        mavenPomFile: 'pom.xml'
        mavenOptions: '-Xmx3072m'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'        # o projeto usa Spring Boot 3.3.4 / Java 17
        jdkArchitectureOption: 'x64'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        goals: 'package'
        options: '-DskipTests'          # remova para rodar os testes na esteira

    - task: CopyFiles@2
      displayName: 'Copiar o JAR para a pasta de artefatos'
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)/target'
        Contents: '*.jar'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publicar artefato drop'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'

- stage: Deploy
  displayName: 'Deploy no Azure Web App'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployWebApp
    pool:
      vmImage: $(vmImageName)
    environment: 'producao'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureWebApp@1
            displayName: 'Publicar JAR no App Service'
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: 'webAppLinux'        # Windows: use 'webApp'
              appName: $(webAppName)
              package: '$(Pipeline.Workspace)/drop/*.jar'
              runtimeStack: 'JAVA|17-java17'